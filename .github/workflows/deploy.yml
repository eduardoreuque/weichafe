name: Deploy to EC2

on:
  push:
    branches:
      - main

# Un solo deploy a la vez: dos pushes seguidos no deben pisarse en el servidor.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y deploy en EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.tsx', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: "file:/tmp/dummy-build.db"

      # Si una prueba falla no se construye ni se despliega nada.
      - name: Pruebas
        run: npm test

      - name: Build Next.js standalone (sin tocar BD)
        run: npm run build
        env:
          DATABASE_URL: "file:/tmp/dummy-build.db"

      - name: Copiar archivos estaticos al standalone
        run: node scripts/prepare-standalone.cjs

      - name: Empaquetar standalone
        run: tar czf /tmp/weichafe-standalone.tar.gz -C .next/standalone .

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/weichafe-ec2
          chmod 600 ~/.ssh/weichafe-ec2
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Subir paquete al servidor
        run: |
          scp -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              -o Compression=yes \
              /tmp/weichafe-standalone.tar.gz \
              ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/weichafe-standalone.tar.gz

      # El paquete se descomprime en una carpeta aparte; la version en produccion
      # no se toca hasta que scripts/deploy-remote.sh respalda y verifica la base.
      # Ese script detiene el servicio, migra, verifica que la app responde y, si
      # algo falla, restaura la version anterior con su base intacta.
      - name: Deploy completo en EC2
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                set -e
                rm -rf ~/weichafe-standalone.new
                mkdir -p ~/weichafe-standalone.new
                tar xzf ~/weichafe-standalone.tar.gz -C ~/weichafe-standalone.new
                cp ~/weichafe-standalone.new/scripts/deploy-remote.sh ~/deploy-remote.sh
                bash ~/deploy-remote.sh
              '

      - name: Verificar que la app responde
        run: |
          sleep 3
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login'

  # Solo corre si el job "deploy" termino sin errores (pruebas, build, migracion y
  # verificacion de la app). Si el deploy falla, no se envia ningun correo.
  notify:
    name: Aviso por correo
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/weichafe-ec2
          chmod 600 ~/.ssh/weichafe-ec2
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Destinatarios y credenciales van en secretos: el repositorio es publico.
      - name: Enviar correo con los cambios y los informes pendientes
        run: python3 scripts/send-deploy-email.py
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DEPLOY_MAIL_TO: ${{ secrets.DEPLOY_MAIL_TO }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
