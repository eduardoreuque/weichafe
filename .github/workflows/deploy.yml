name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build y deploy en EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Build Next.js standalone (sin tocar BD)
        run: npm run build
        env:
          DATABASE_URL: "file:/tmp/dummy-build.db"

      - name: Copiar archivos estaticos al standalone
        run: node scripts/prepare-standalone.cjs

      - name: Empaquetar standalone
        run: tar czf /tmp/weichafe-standalone.tar.gz -C .next/standalone .

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/weichafe-ec2
          chmod 600 ~/.ssh/weichafe-ec2
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Subir paquete al servidor
        run: |
          scp -v -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              /tmp/weichafe-standalone.tar.gz \
              ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/weichafe-standalone.tar.gz

      - name: Crear directorio de despliegue y uploads con sudo
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'sudo mkdir -p ~/weichafe-standalone /var/weichafe/uploads && sudo chown -R ec2-user:ec2-user /var/weichafe'
        continue-on-error: true

      - name: Preservar uploads
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'if [ -d /var/weichafe/uploads ]; then cp -r /var/weichafe/uploads /tmp/uploads.backup; fi'
        continue-on-error: true

      - name: Preservar base de datos existente
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'if [ -f ~/weichafe-standalone/prisma/dev.db ]; then cp ~/weichafe-standalone/prisma/dev.db /tmp/dev.db.backup; fi'
        continue-on-error: true

      - name: Descomprimir paquete
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'tar xzf ~/weichafe-standalone.tar.gz -C ~/weichafe-standalone'

      - name: Restaurar uploads
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                if [ -d /tmp/uploads.backup ]; then
                  sudo rm -rf /var/weichafe/uploads
                  sudo mv /tmp/uploads.backup /var/weichafe/uploads
                  sudo chown -R ec2-user:ec2-user /var/weichafe
                fi
              '
        continue-on-error: true

      - name: Restaurar base de datos
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                if [ -f /tmp/dev.db.backup ]; then
                  cp /tmp/dev.db.backup ~/weichafe-standalone/prisma/dev.db
                  rm -f /tmp/dev.db.backup
                fi
              '
        continue-on-error: true

      - name: Instalar dependencias en servidor
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                cd ~/weichafe-standalone
                if [ -f package.json ]; then
                  npm ci --no-audit --no-fund 2>/dev/null || true
                fi
              '
        continue-on-error: true

      - name: Aplicar migraciones de Prisma
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                cd ~/weichafe-standalone
                npx prisma migrate deploy --schema=./prisma/schema.prisma 2>/dev/null || echo "No hay migraciones pendientes"
              '
        continue-on-error: true

      - name: Generar cliente Prisma
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                cd ~/weichafe-standalone
                npx prisma generate --schema=./prisma/schema.prisma 2>/dev/null || true
              '
        continue-on-error: true

      - name: Configurar servicio systemd
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'printf "%s\n" \
                "[Unit]" \
                "Description=Weichafe Next Standalone" \
                "After=network.target" \
                "" \
                "[Service]" \
                "Type=simple" \
                "User=ec2-user" \
                "WorkingDirectory=/home/ec2-user/weichafe-standalone" \
                "Environment=HOSTNAME=0.0.0.0" \
                "Environment=PORT=3000" \
                "Environment=DATABASE_URL=file:/home/ec2-user/weichafe-standalone/prisma/dev.db" \
                "Environment=UPLOAD_DIR=/var/weichafe/uploads" \
                "ExecStart=/usr/bin/node server.js" \
                "Restart=always" \
                "RestartSec=5" \
                "" \
                "[Install]" \
                "WantedBy=multi-user.target" \
                | sudo tee /etc/systemd/system/weichafe.service >/dev/null && sudo systemctl daemon-reload && sudo systemctl enable weichafe.service'

      - name: Reiniciar servicio
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                sudo systemctl restart weichafe.service
                sleep 5
                sudo systemctl is-active weichafe.service
              '

      - name: Verificar que la app responde
        run: |
          sleep 5
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login'