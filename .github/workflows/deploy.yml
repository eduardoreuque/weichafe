name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build y deploy en EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.tsx', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: "file:/tmp/dummy-build.db"

      - name: Build Next.js standalone (sin tocar BD)
        run: npm run build
        env:
          DATABASE_URL: "file:/tmp/dummy-build.db"

      - name: Copiar archivos estaticos al standalone
        run: node scripts/prepare-standalone.cjs

      - name: Empaquetar standalone
        run: tar czf /tmp/weichafe-standalone.tar.gz -C .next/standalone .

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/weichafe-ec2
          chmod 600 ~/.ssh/weichafe-ec2
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Subir paquete al servidor
        run: |
          scp -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              -o Compression=yes \
              /tmp/weichafe-standalone.tar.gz \
              ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/weichafe-standalone.tar.gz

      - name: Deploy completo en EC2
        run: |
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} '
                set -e
                sudo mkdir -p ~/weichafe-standalone /var/weichafe/uploads
                sudo chown -R ec2-user:ec2-user /var/weichafe
                
                # Preservar uploads y BD
                if [ -d /var/weichafe/uploads ]; then cp -r /var/weichafe/uploads /tmp/uploads.backup; fi
                if [ -f ~/weichafe-standalone/prisma/dev.db ]; then cp ~/weichafe-standalone/prisma/dev.db /tmp/dev.db.backup; fi
                
                # Descomprimir nuevo paquete
                rm -rf ~/weichafe-standalone
                mkdir -p ~/weichafe-standalone
                tar xzf ~/weichafe-standalone.tar.gz -C ~/weichafe-standalone
                
                # Restaurar uploads y BD
                if [ -d /tmp/uploads.backup ]; then
                  sudo rm -rf /var/weichafe/uploads
                  sudo mv /tmp/uploads.backup /var/weichafe/uploads
                  sudo chown -R ec2-user:ec2-user /var/weichafe
                fi
                if [ -f /tmp/dev.db.backup ]; then
                  cp /tmp/dev.db.backup ~/weichafe-standalone/prisma/dev.db
                  rm -f /tmp/dev.db.backup
                fi

                # Respaldo versionado de la base antes de cada deploy (se conservan los ultimos 10)
                sudo mkdir -p /var/weichafe/backups
                if [ -f ~/weichafe-standalone/prisma/dev.db ]; then
                  sudo cp ~/weichafe-standalone/prisma/dev.db "/var/weichafe/backups/dev-$(date +%Y%m%d-%H%M%S).db"
                  sudo sh -c "ls -1t /var/weichafe/backups | tail -n +11 | xargs -r -I{} rm -f /var/weichafe/backups/{}"
                fi

                # Secretos persistentes generados en el servidor.
                # Antes AUTH_SECRET estaba escrito en este workflow y era visible en
                # GitHub: cualquiera con acceso al repo podia firmar sesiones validas.
                if [ ! -f /var/weichafe/auth.env ]; then
                  printf "AUTH_SECRET=%s\n" "$(head -c 48 /dev/urandom | base64 | tr -d "\n=")" | sudo tee /var/weichafe/auth.env >/dev/null
                  sudo chmod 600 /var/weichafe/auth.env
                fi
                # Codigo maestro para /recovery (recuperar acceso sin soporte externo)
                if [ ! -f /var/weichafe/recovery.env ]; then
                  printf "RECOVERY_CODE=%s\n" "$(head -c 200 /dev/urandom | tr -dc "A-Za-z0-9" | head -c 24)" | sudo tee /var/weichafe/recovery.env >/dev/null
                  sudo chmod 600 /var/weichafe/recovery.env
                fi
                sudo chown -R ec2-user:ec2-user /var/weichafe/backups
                
                # Aplicar migraciones
                cd ~/weichafe-standalone
                DB_URL="file:/home/ec2-user/weichafe-standalone/prisma/dev.db"

                # NOTA: la migracion 20260723114800_add_schedule_table usaba
                # "ALTER TABLE ... ADD CONSTRAINT ... FOREIGN KEY", que SQLite no
                # soporta. Quedaba marcada como fallida y con `set -e` el deploy se
                # abortaba antes de reiniciar el servicio (los cambios nunca llegaban
                # a la web). Ahora, si migrate deploy falla, se limpian las
                # migraciones fallidas y se reintenta.
                if ! DATABASE_URL="$DB_URL" npx prisma migrate deploy --schema=./prisma/schema.prisma; then
                  echo "--- migrate deploy fallo: reparando migraciones fallidas ---"
                  if [ -f scripts/list-failed-migrations.cjs ]; then
                    for MIG in $(DATABASE_URL="$DB_URL" node scripts/list-failed-migrations.cjs); do
                      echo "Marcando como rolled-back: $MIG"
                      DATABASE_URL="$DB_URL" npx prisma migrate resolve --rolled-back "$MIG" || true
                    done
                  fi
                  echo "--- Reintentando migrate deploy ---"
                  DATABASE_URL="$DB_URL" npx prisma migrate deploy --schema=./prisma/schema.prisma
                fi

                # Regularizar ventas de clase diaria huérfanas (vincular por nombre de alumno)
                if [ -f scripts/regularize-orphan-class-sales.cjs ]; then
                  echo "--- Regularizando ventas huerfanas ---"
                  DATABASE_URL="$DB_URL" node scripts/regularize-orphan-class-sales.cjs || echo "Regularizacion no critica, continuando"
                fi

                # Cargar horarios base en la BD si la tabla esta vacia
                if [ -f scripts/import-schedules.cjs ]; then
                  echo "--- Importando horarios base ---"
                  DATABASE_URL="$DB_URL" node scripts/import-schedules.cjs || echo "Import de horarios no critico, continuando"
                fi

                # Backfill de horarios en pagos y ventas sin vincular
                if [ -f scripts/backfill-schedules.cjs ]; then
                  echo "--- Ejecutando backfill de horarios en pagos y ventas ---"
                  DATABASE_URL="$DB_URL" node scripts/backfill-schedules.cjs || echo "Backfill no critico, continuando"
                fi
                
                # Configurar servicio systemd
                printf "%s\n" \
                  "[Unit]" \
                  "Description=Weichafe Next Standalone" \
                  "After=network.target" \
                  "" \
                  "[Service]" \
                  "Type=simple" \
                  "User=ec2-user" \
                  "WorkingDirectory=/home/ec2-user/weichafe-standalone" \
                  "Environment=HOSTNAME=0.0.0.0" \
                  "Environment=PORT=3000" \
                  "Environment=DATABASE_URL=file:/home/ec2-user/weichafe-standalone/prisma/dev.db" \
                  "Environment=UPLOAD_DIR=/var/weichafe/uploads" \
                  "EnvironmentFile=-/var/weichafe/auth.env" \
                  "EnvironmentFile=-/var/weichafe/recovery.env" \
                  "ExecStart=/usr/bin/node server.js" \
                  "Restart=always" \
                  "RestartSec=5" \
                  "" \
                  "[Install]" \
                  "WantedBy=multi-user.target" \
                  | sudo tee /etc/systemd/system/weichafe.service >/dev/null
                
                sudo systemctl daemon-reload
                sudo systemctl enable weichafe.service
                sudo systemctl restart weichafe.service
                sleep 5
                sudo systemctl is-active weichafe.service
              '

      - name: Verificar que la app responde
        run: |
          sleep 3
          ssh -i ~/.ssh/weichafe-ec2 \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login'