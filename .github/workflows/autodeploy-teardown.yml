name: Auto Deploy and Teardown

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Tiempo en minutos para mantener la instancia en ejecución antes de apagar (0 = no apagar)'
        required: false
        default: '10'

jobs:
  deploy-and-teardown:
    runs-on: ubuntu-latest
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 instance
        id: start
        run: |
          aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$EC2_INSTANCE_ID"
          EC2_IP=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

      - name: Write SSH key
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY secret not set" >&2
            exit 1
          fi
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem
          echo "SSH_KEY=./deploy_key.pem" >> $GITHUB_ENV

      - name: Run deploy script (build + scp + service)
        env:
          EC2_HOST: ${{ env.EC2_IP }}
          SSH_KEY: ${{ env.SSH_KEY }}
        run: |
          chmod +x scripts/deploy-ec2.sh || true
          ./scripts/deploy-ec2.sh

      - name: Healthcheck
        run: |
          IP=${{ env.EC2_IP }}
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://$IP/login" || true)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed" >&2
          exit 1

      - name: Keep instance alive for configured minutes
        if: ${{ github.event.inputs.keep_alive_minutes != '0' }}
        run: |
          minutes=${{ github.event.inputs.keep_alive_minutes }}
          echo "Keeping instance alive for $minutes minutes"
          sleep $((minutes * 60))

      - name: Stop EC2 instance
        if: ${{ github.event.inputs.keep_alive_minutes != '0' }}
        run: |
          aws ec2 stop-instances --instance-ids "$EC2_INSTANCE_ID"
          aws ec2 wait instance-stopped --instance-ids "$EC2_INSTANCE_ID"
